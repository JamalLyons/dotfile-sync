name: CI

on:
  push:
    branches: [ trunk, "feature/**" ]
  pull_request:
    branches: [ trunk ]

jobs:
  package:
    name: DotfileSyncKit (swift build + swift test)
    runs-on: macos-26
    defaults:
      run:
        working-directory: Packages/DotfileSyncKit
    steps:
      - uses: actions/checkout@v4
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version
      - name: Build package and tests (warnings are errors)
        run: swift build --build-tests -Xswiftc -warnings-as-errors
      - name: Run fixture-isolated tests
        run: swift test -Xswiftc -warnings-as-errors

  app:
    name: DotfileSync.app (xcodebuild build + test)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build and test the app (unsigned)
        run: |
          xcodebuild -project App/DotfileSync.xcodeproj -scheme DotfileSync \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build test
